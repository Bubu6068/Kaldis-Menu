<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Circular text paths -->
    <path id="topArc" d="M 32,100 A 68,68 0 1,1 168,100" fill="none" />
    <path id="botArc" d="M 168,100 A 68,68 0 0,1 32,100" fill="none" />
    <!-- Gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5BE6E" />
      <stop offset="50%" stop-color="#D5A33A" />
      <stop offset="100%" stop-color="#B38022" />
    </linearGradient>
  </defs>

  <!-- Outer drop shadow -->
  <circle cx="100" cy="100" r="94" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="4" />
  
  <!-- Outer Brown Ring -->
  <circle cx="100" cy="100" r="86" fill="#3D2114" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Inner White Disc -->
  <circle cx="100" cy="100" r="54" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Brand Typography Curved -->
  <text fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="19" font-weight="700" letter-spacing="4">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">KALDI'S</textPath>
  </text>
  
  <text fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="5">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">COFFEE</textPath>
  </text>

  <!-- Decorative Side Stars -->
  <circle cx="37" cy="100" r="2.5" fill="#D5A33A" />
  <circle cx="163" cy="100" r="2.5" fill="#D5A33A" />

  <!-- Center Steaming Coffee Cup Icon (Vector) -->
  <g transform="translate(100, 104) scale(1.15)">
    <!-- Steam lines -->
    <path d="M -9,-14 C -11,-20 -7,-24 -9,-30" fill="none" stroke="#D5A33A" stroke-width="2" stroke-linecap="round" />
    <path d="M 0,-16 C -2,-22 2,-26 0,-32" fill="none" stroke="#D5A33A" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 9,-14 C 7,-20 11,-24 9,-30" fill="none" stroke="#D5A33A" stroke-width="2" stroke-linecap="round" />
    
    <!-- Cup Body -->
    <path d="M -16,-11 L 16,-11 C 15,3 10,13 0,14 C -10,13 -15,3 -16,-11 Z" fill="#D5A33A" />
    
    <!-- Cup Handle -->
    <path d="M 14,-7 C 21,-7 21,5 12,6" fill="none" stroke="#D5A33A" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Saucer / Base -->
    <path d="M -18,17 L 18,17" stroke="#D5A33A" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
